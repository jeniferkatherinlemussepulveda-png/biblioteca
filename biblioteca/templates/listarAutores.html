{% extends "base.html" %} 
{% block content %}
<div class="justify-content-center text-center mt-3">
<table class="table table-dark table-striped">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Lugar de nacimiento</th>
                        <th>fecha de nacimiento</th>
                        <th>Accion</th>
                    </tr>
                </thead>
                <tbody>
                    {% for autor in autores %}
                    <tr>
                        <td>{{autor.nombre}}</td>
                        <td>{{autor.lugar_nacimiento}}</td>
                        <td>{{autor.fecha_nacimiento}}</td>
                        <td>
                        <a href="{%url 'editarAutor' autor.pk %}" class="btn btn-warning">Actualizar</a>
                        <a href="{%url 'eliminarAutor' autor.pk %}" class="btn btn-danger">eliminar</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
{% endblock %}
