{% extends "base.html" %}
{% block content %}
<form action="{% url 'editarLibro' libro.pk %}" method='POST'>
    {% csrf_token %}
<div class="mb-3">
    <label for="titulo" class="form-label">titulo</label>
    <input
        type="text"
        class="form-control"
        name="titulo"
        id="titulo"
        value="{{libro.titulo}}">
</div>
<div class="mb-3">
    <label for="descripcion" class="form-label">descripcion</label>
    <textarea class="form-control"
    name="descripcion" 
    id="descripcion" 
    class="form-control"
    >{{libro.descripcion}}</textarea>
</div>

<div class="mb3-3">
        <label for="autor">autor</label>
        <select class="form-select" 
        name="autor" 
        id="autor">
            {% for autor in autores %}
            <option value="{{autor.id}}"
            {% if autor.id == libro.autor.id %}
            selected
            {% endif %}
            >{{autor.nombre}}</option>
            {% endfor %}
            </select>
        </div>
        <input type="submit"class="btn btn-warning" value="Actualizar"/>
</form>
    <div class="container mb-2">
        <form action="{% url 'eliminarLibro' libro.pk %}" method='POST'>
    {% csrf_token %}
    <input type="submit" class="btn btn-danger" value="Eliminar"/>
        </form>
    </div>
    {% endblock %}
